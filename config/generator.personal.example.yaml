# Example generator config for a personal GCP project. Sparse on purpose: it
# pins only what differs per environment. Copy it to config/<env>.local.yaml
# (gitignored), fill in your project's names and pass it to a launch:
#   --config_uri gs://my-bucket/synthetic/config/personal.yaml
config_version: 1
io:
  dlq_table: my-project.synthetic_data_quality.dlq
  validation_runs_table: my-project.synthetic_data_quality.validation_runs
  source_stats_table: my-project.synthetic_data_quality.source_table_stats
serving:
  model_uri: gs://my-bucket/synthetic/models/gemma4/e4b-it/v1/
  vllm_dtype: float16
guardrails:
  env: dev
