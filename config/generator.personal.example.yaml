# Example generator config for a personal GCP project. Sparse on purpose: it
# pins only what differs per environment. Copy it to config/<env>.local.yaml
# (gitignored), fill in your project's names and pass it to a launch:
#   --config_uri gs://my-bucket/synthetic/config/personal.yaml
config_version: 1
io:
  dlq_table: my-project.synthetic_data_quality.dlq
  validation_runs_table: my-project.synthetic_data_quality.validation_runs
  source_stats_table: my-project.synthetic_rag.source_table_stats
serving:
  # The T4-safe entry of config/models.yml: Gemma cannot run on a T4.
  model_uri: gs://my-bucket/synthetic/models/qwen3/4b-instruct-2507/v1/
  # The workers' GPU. The launcher records it, and derives vllm_dtype from it
  # (t4: float16, which this bf16 checkpoint needs on a T4); left at the l4
  # default, a T4 launch is refused before the vLLM server starts.
  gpu: t4
guardrails:
  env: dev
