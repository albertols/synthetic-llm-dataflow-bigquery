name: Release tag + report

# Post-merge release layer (spec: docs/superpowers/specs/
# 2026-08-06-e2e-reporting-scripts-release-design.md). Tags every merge to
# master with SemVer derived from the squash-merge title, generates the
# redacted before/after release report from committed evidence bundles in
# docs/releases/<version>/evidence/ (legacy integration_test/ for old tags;
# NO GCP access), and commits docs/releases/<version>/.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag-and-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Self-trigger guard: the report commit below carries this marker.
    if: ${{ !contains(github.event.head_commit.message, '[release-report]') }}
    env:
      UV_DEFAULT_INDEX: https://pypi.org/simple
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0          # full history: tags + git show at base ref
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --group dev
      - name: Compute version
        id: ver
        run: |
          PREV=$(git describe --tags --abbrev=0 --match "v[0-9]*" 2>/dev/null || echo "")
          TITLE=$(git log -1 --pretty=%s)
          case "$TITLE" in
            *"[release-report]"*) echo "skip=true" >> "$GITHUB_OUTPUT"; echo "head commit is the release-report commit; skipping"; exit 0;;
          esac
          echo "skip=false" >> "$GITHUB_OUTPUT"
          VERSION=$(uv run --no-sync python3 scripts/release/make_release_report.py \
            --print-next-version --title "$TITLE" ${PREV:+--prev "$PREV"})
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"
      - name: Generate report
        if: steps.ver.outputs.skip != 'true'
        run: |
          PREV="${{ steps.ver.outputs.prev }}"
          uv run --no-sync python3 scripts/release/make_release_report.py \
            --version "${{ steps.ver.outputs.version }}" \
            --date "$(date -u +%Y-%m-%d)" \
            ${PREV:+--base-ref "$PREV"} \
            --head-ref "${{ github.sha }}" \
            --out-dir docs/releases
      - name: Tag, commit report, push
        if: steps.ver.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/releases
          # Check if tag already exists (re-run safety)
          if git rev-parse -q --verify "refs/tags/${{ steps.ver.outputs.version }}" >/dev/null; then
            echo "tag already exists; nothing to do"
            exit 0
          fi
          # Only commit if there are staged changes
          git diff --cached --quiet || git commit -m "docs(releases): ${{ steps.ver.outputs.version }} report [release-report]"
          git tag "${{ steps.ver.outputs.version }}"
          # Retry push to handle non-fast-forward races
          pushed=""
          for i in 1 2 3; do
            if git push origin master --tags; then pushed=1; break; fi
            git pull --rebase origin master
            # `git pull --rebase` replays the report commit onto the new
            # master tip, giving it a new sha — the tag created above still
            # points at the OLD (now orphaned) commit unless re-pointed here.
            # `git describe`/tag-based lookups on master would otherwise
            # silently miss this release.
            git tag -f "${{ steps.ver.outputs.version }}"
          done
          [ -n "$pushed" ] || { echo "push failed after 3 attempts" >&2; exit 1; }
