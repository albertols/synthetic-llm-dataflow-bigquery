# What the Dataflow Solution Guides (DSG) replica contains, and how it is
# built from this repository (ADR 0040). Read by scripts/dsg/sync.py from the
# ref being synced, so an old tag syncs with the manifest it shipped with.

source_repo: https://github.com/albertols/synthetic-llm-dataflow-bigquery
target_repo: GoogleCloudPlatform/dataflow-solution-guides
target_base: main
branch_prefix: sync/synthetic-llm-dataflow-bigquery-
pr_title: "feat({pipeline_name}): synthetic data generation solution guide ({ref})"
pipeline_dir: pipelines/synthetic-llm-dataflow-bigquery

# Replaced wholesale on every sync. Nothing else in the DSG repo is touched
# except the index_rows below.
owned_paths:
  - pipelines/synthetic-llm-dataflow-bigquery
  - terraform/synthetic-llm-dataflow-bigquery
  - use_cases/Synthetic_Data_Generation.md

# Generated by `terraform apply` in a user's checkout; survives a re-sync.
preserve:
  - pipelines/synthetic-llm-dataflow-bigquery/scripts/00_set_variables.sh

# Golden-source files copied under pipeline_dir, same relative paths.
include:
  - LICENSE
  - README.md
  - pyproject.toml
  - uv.lock
  - packages/sdfb-core/**
  - packages/sdfb-beam/**
  - packages/sdfb-tests/**
  - config/bq_schema/**
  - config/relationships/README.md
  - config/relationships/example_*.yaml
  - config/relationships/gcp_public/**
  - config/models.yml
  - config/thresholds.yml
  - docker/**
  - docs/adr/**
  - docs/designs/**
  - docs/assets/architecture-overview.*
  - docs/DDL_CONTRACT_GUIDE.md
  - docs/DEPLOYMENT_PREREQUISITES.md
  - docs/MODEL_LAYOUT.md
  - scripts/extract_ddl.py
  - scripts/derive_landing_schema.py
  - scripts/deployment_prerequisites.py
  - scripts/relationships/card.py

exclude:
  - "**/__pycache__/**"
  - "**/.DS_Store"
  # Tests of tooling that stays in the golden source (release reports, E2E
  # bundles, figure scripts, the personal-GCP layer, the Composer DAG, this
  # sync itself). The sync fails if a shipped test loads an unshipped script.
  - packages/sdfb-tests/tests/unit/scripts/test_build_full_report.py
  - packages/sdfb-tests/tests/unit/scripts/test_dsg_precheck.py
  - packages/sdfb-tests/tests/unit/scripts/test_dsg_sync.py
  - packages/sdfb-tests/tests/unit/scripts/test_e2e_*.py
  - packages/sdfb-tests/tests/unit/scripts/test_freetext_crosscheck.py
  - packages/sdfb-tests/tests/unit/scripts/test_history_mappings.py
  - packages/sdfb-tests/tests/unit/scripts/test_make_release_*.py
  - packages/sdfb-tests/tests/unit/scripts/test_redact*.py
  - packages/sdfb-tests/tests/unit/scripts/test_redaction.py
  - packages/sdfb-tests/tests/unit/scripts/test_source_synthetic_stats_diff.py
  - packages/sdfb-tests/tests/unit/public_cloud/**
  - packages/sdfb-tests/tests/unit/cli/test_run_tableset.py
  - packages/sdfb-tests/tests/unit/validation/test_freetext_rules.py
  # Reads composer/ (not shipped); the golden source's CI keeps covering it.
  - packages/sdfb-tests/tests/unit/docker/test_launch_surfaces.py

# Explicit test -> script pairs the automatic `"scripts" / ...` detection
# cannot see.
script_tests: {}

# dsg/<dir> -> DSG-relative destination.
overlays:
  dsg/pipeline: pipelines/synthetic-llm-dataflow-bigquery
  dsg/terraform: terraform/synthetic-llm-dataflow-bigquery
  dsg/use_cases: use_cases

# Prepended to the shipped README.md (and not copied as a file).
readme_header: dsg/pipeline/README.header.md

requirements:
  runtime_package: sdfb-beam
  dev_group: dev

pylintrc:
  vendored: dsg/pylintrc
  target: pipelines/pylintrc

precheck_config: dsg/precheck.yaml
pr_template: dsg/PR_TEMPLATE.md

# Idempotent edits to DSG index files. `anchor` rows replace the line that
# holds `marker`, or insert after the line that holds `anchor`; rows without
# an anchor keep a block between dsg-sync markers at the end of the file.
index_rows:
  - file: README.md
    anchor: "[Gaming Analytics](./use_cases/Gaming_Analytics.md)"
    marker: "[Synthetic Data Generation](./use_cases/Synthetic_Data_Generation.md)"
    text: "| [Synthetic Data Generation](./use_cases/Synthetic_Data_Generation.md) | Batch synthetic BigQuery tables from a DDL and a reference sample, with a self-hosted LLM on GPU workers | Ready :white_check_mark: |"
  - file: pipelines/README.md
    anchor: "[gaming_analytics_java](./gaming_analytics_java/)"
    marker: "[synthetic-llm-dataflow-bigquery](./synthetic-llm-dataflow-bigquery/)"
    text: "| Synthetic Data Generation | Python | [synthetic-llm-dataflow-bigquery](./synthetic-llm-dataflow-bigquery/) |"
  - file: AGENTS.md
    anchor: "│   ├── gaming_analytics_java/"
    marker: "│   ├── synthetic-llm-dataflow-bigquery/"
    text: "│   ├── synthetic-llm-dataflow-bigquery/ # Python: batch relational synthetic data, self-hosted LLM (vLLM) on L4, Flex Template"
  - file: pipelines/AGENTS.md
    anchor: "| `log_replication_splunk/` | Flex Template |"
    marker: "| `synthetic-llm-dataflow-bigquery/` |"
    text: "| `synthetic-llm-dataflow-bigquery/` | Python (Flex Template) | Batch relational synthetic data, vLLM on NVIDIA L4, BigQuery landing + DLQ + validation_runs | [Synthetic_Data_Generation.md](../use_cases/Synthetic_Data_Generation.md) |"
  - file: terraform/AGENTS.md
    anchor: "| `gaming_analytics/` |"
    marker: "| `synthetic-llm-dataflow-bigquery/` |"
    text: "| `synthetic-llm-dataflow-bigquery/` | BigQuery datasets (`synthetic_source` snapshots, `synthetic_data`, `synthetic_data_quality`), Artifact Registry, Secret Manager (Kaggle), Dataflow + Cloud Build Service Accounts | `pipelines/synthetic-llm-dataflow-bigquery/` |"
  - file: .agents/skills/use-case-deployment/SKILL.md
    anchor: "| **Log Replication** |"
    marker: "| **Synthetic Data Generation** |"
    text: "| **Synthetic Data Generation** | `terraform/synthetic-llm-dataflow-bigquery` | `pipelines/synthetic-llm-dataflow-bigquery` | `./scripts/04_run_dataflow.sh` | BigQuery `synthetic_source` snapshots of `thelook_ecommerce` | `./scripts/05_verify_run.sh RUN_ID` (BigQuery `synthetic_data`, `synthetic_data_quality.validation_runs`) |"
  - file: AGENTS.md
    anchor: null
    marker: synthetic-llm-dataflow-bigquery
    text: &deployment |-
      ### Synthetic data generation deployment

      Batch, not streaming: `terraform apply` in `terraform/synthetic-llm-dataflow-bigquery` (US BigQuery, an L4 region), then from `pipelines/synthetic-llm-dataflow-bigquery` run `scripts/01_build_and_push_container.sh`, `02_stage_models.sh` (Kaggle secrets for Gemma, or `MODEL=qwen3-4b`), `03_build_flex_template.sh`, `04_run_dataflow.sh` and `05_verify_run.sh RUN_ID`. Workers use private IPs and `synthetic-llm-dataflow-sa`; Cloud Build uses `synthetic-llm-build-sa`. The directory is a replica of the golden source recorded in `.sync-source.json`: change the golden source, never these files. Report live-cloud verification separately from local tests.
  - file: pipelines/AGENTS.md
    anchor: null
    marker: synthetic-llm-dataflow-bigquery
    text: *deployment
  - file: terraform/AGENTS.md
    anchor: null
    marker: synthetic-llm-dataflow-bigquery
    text: *deployment
