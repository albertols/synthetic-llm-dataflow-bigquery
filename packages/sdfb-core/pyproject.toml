[project]
name = "sdfb-core"
version = "0.1.0"
description = "Pure-Python core for synthetic-dataflow-bigquery: contracts, codegen, engine ABC, prompt templates."
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
readme = { content-type = "text/markdown", text = "Pure-Python core. No Beam, no GCP, no torch dependencies." }

dependencies = [
    "pydantic>=2.7,<3.0",
    "pyyaml>=6.0",
    "numpy>=1.26",  # vectorized bulk sampling — distribution-estimator spine (ADR 0013)
    # WS3 evaluation — Tier 1 (scipy/sklearn) + Tier 2 (sdmetrics) are base
    # per the locked decision. Audit 2026-07-21: sdmetrics 0.28.x declares
    # torch ONLY under its optional [torch] extra, so the "no torch in
    # sdfb-core" rule holds with a base install.
    "scipy>=1.11.0",
    "scikit-learn>=1.4.0",
    "pandas>=2.2.0",
    "sdmetrics>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdfb_core"]
