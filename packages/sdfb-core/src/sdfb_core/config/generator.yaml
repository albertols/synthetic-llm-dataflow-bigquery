# Generator configuration: the DEFAULTS. Every value line is the default the
# generator loads. Precedence: this file < composer/sdfb_env.yaml < DAG
# trigger values < your --config_uri file (keys it omits fall back).
# Copy only the keys you want to pin; a file of your own starts with
# `config_version: 1`. Comments are rendered from sdfb_core/config/
# catalogue.yaml by scripts/doc/render_generator_config.py --fix (never
# touches a value).
#
#   [--x · ADR n · required]  the CLI / Flex / Composer flag, its ADR, and
#                             whether a launch needs a value
#   ↑ / ↓                     what raising / lowering the value does
#   null = ...                what a null means (otherwise `required`)
#   'on', 'false', '8192'     quoted: string-encoded CLI values, keep them

config_version: 1

# =========================================================================
# IO — where a launch reads from and writes to
# =========================================================================
io:
  # DDL pin — A pinned _ddl.json read only when live schema extraction fails
  # (air-gap, BigQuery outage). [--ddl_uri · ADR 0027]
  # ↑ A path: the pin is the fallback, and its staleness is reported as
  # ddl_pin_drift. · ↓ Empty: no fallback — a failed live extraction stops
  # the launch.
  ddl_uri: ''

  # Reference table — The source table the reference sample is SELECTed from
  # and the schema is extracted from. [--reference_table · ADR 0005 ·
  # required]
  # ↑ Point it at another table to generate from a different source. · ↓
  # Required with launch.tables explicit (the default) — a launch without it
  # is refused; unused with all.
  reference_table: null

  # Landing table — Where valid synthetic rows land; a comma-separated list
  # plans several tables at once. [--landing_table · ADR 0029, 0030 ·
  # required]
  # ↑ More tables in the list widen the plan to their components (one job in
  # single_job mode). · ↓ Required with launch.tables explicit (the default)
  # — a launch without it is refused; unused with all.
  landing_table: null

  # Dead-letter table — Where rejected records land with their rule id and
  # full error context. [--dlq_table · required]
  # ↑ Point it at another dataset to keep a run's rejects apart. · ↓ Required
  # — a launch without it is refused.
  dlq_table: null

  # Create landing table — true creates the landing table on first write from
  # the derived schema; anything else needs it to exist.
  # [--create_if_not_exists]
  # ↑ true: a first launch creates the table, without parameterized column
  # constraints. · ↓ false: a missing landing table fails the load job.
  create_if_not_exists: 'false'

  # Run summary table — Where each launch writes one summary row per table —
  # the gate outcome and its provenance. [--validation_runs_table]
  # ↑ Set: every launch is recorded, and the evaluator can find it. · ↓
  # Empty: no summary row is written.
  validation_runs_table: ''

  # RAG chunk store — The persisted embedding store B.1 reads instead of
  # re-embedding its row documents. [--rag_chunks_table · ADR 0019]
  # ↑ Set: stored vectors are read; with build_rag_layer they are also
  # written. · ↓ Empty: every worker embeds its row documents in setup.
  rag_chunks_table: ''

  # Free-text pool store — The persisted free-text pools workers read instead
  # of rebuilding them. [--freetext_pools_table · ADR 0020]
  # ↑ Set: stored pools are served; with build_pool_layer a branch builds
  # missing ones. · ↓ Empty: every worker process infers its own pools in
  # setup.
  freetext_pools_table: ''

  # Fan-out stats cache — Caches each driving edge's measured source fan-out
  # so a repeat launch skips the measurement. [--fk_fanout_stats_table ·
  # ADR 0036]
  # ↑ Set: a repeat launch reads the cached histogram. · ↓ Empty: fan-out is
  # measured on every launch.
  fk_fanout_stats_table: ''

  # Source stats table — Where per-column source stats rows are written, once
  # per table and reference digest. [--source_stats_table · ADR 0022]
  # ↑ Set: the stats are queryable after the run. · ↓ Empty: the stats land
  # only in the log and the JSON artifact.
  source_stats_table: ''

  # Source stats JSON — A gs:// or local path the source stats are also
  # written to as one JSON file. [--source_stats_json]
  # ↑ Set: the stats are kept next to the run's other artifacts. · ↓ Empty:
  # no JSON artifact.
  source_stats_json: ''

  # Source dataset — With launch.tables all, the project.dataset every
  # table's source is read from under the table's own name, unless the model
  # gives the table a source_table. [--source_dataset · ADR 0045]
  # ↑ Set: a whole-model launch reads each source from this dataset. · ↓
  # Empty: required with launch.tables all; an explicit launch reads
  # io.reference_table instead.
  source_dataset: ''

  # Landing dataset — With launch.tables all, the project.dataset every table
  # lands in, under its own name. [--landing_dataset · ADR 0045]
  # ↑ Set: a whole-model launch writes each table there. · ↓ Empty: required
  # with launch.tables all; an explicit launch writes to io.landing_table
  # instead.
  landing_dataset: ''

# =========================================================================
# LAUNCH — which tables, how many jobs, and the launch identity
# =========================================================================
launch:
  # Run id — The launch's identity — it seeds batch draws when seed is empty
  # and names every summary row. [--run_id · required]
  # ↑ A fresh id per trigger keeps retriggers from replaying the same rows. ·
  # ↓ Required, and a flag only — a config file may not set it.
  # run_id: null

  # Tables — Which tables a launch generates: explicit takes io.landing_table
  # and its components; all takes every enabled table of the one model file
  # relational.relationships_uri names. [--tables · ADR 0045]
  # ↑ all: one launch generates the whole model, in batch jobs of at most
  # max_tables_per_job tables. · ↓ explicit (the default): the targets and
  # the tables their components pull in, as before.
  tables: explicit

  # Tables per job (K) — With launch.tables all, the most tables one Dataflow
  # job generates. A connected component is never split, so a larger one gets
  # a job of its own. [--max_tables_per_job · ADR 0045]
  # ↑ Fewer, larger jobs; each launcher preps more tables inside the Flex
  # Template's 12-minute window. · ↓ More, smaller jobs; each one pays the
  # image pull and the vLLM ignition again.
  max_tables_per_job: 10

  # Parallel batch jobs — How many batch jobs scripts/launch/run_model.py
  # runs at once. The Composer DAG's tables=all branch takes its cap from the
  # Airflow Variable SDFB_MAX_PARALLEL_JOBS instead. [--max_parallel_jobs ·
  # ADR 0045]
  # ↑ The batches finish sooner; each job holds its workers' GPUs, so stay
  # inside the GPU quota. · ↓ One at a time (the default): never more GPUs
  # than one job asks for.
  max_parallel_jobs: 1

  # Prep threads — Threads a multi-table launcher reads schemas, reference
  # samples and source stats on, before the cross-table steps run in plan
  # order. [--prep_workers · ADR 0045]
  # ↑ More tables read at once, and more concurrent BigQuery reads from the
  # launcher. · ↓ 1: each table is read in turn, exactly as before ADR 0045.
  prep_workers: 8

  # Batch index — The batch of a whole-model launch this job generates (b00
  # is 0). The Composer DAG's tables=all branch and
  # scripts/launch/run_model.py set it. [--batch_index]
  # ↑ A later batch of the same plan. · ↓ Unset: the launcher runs every
  # batch itself, in sequence on the CLI (refused on Flex above one batch).
  # batch_index: null

  # Batch count — How many batches the orchestrator planned. The launcher
  # plans again and stops when its own count differs, because the model or K
  # changed in between. [--batch_count]
  # ↑ Must equal the launcher's own plan. · ↓ Unset: only together with
  # batch_index unset.
  # batch_count: null

  # Generator defaults digest — The digest of the generator.yaml the DAG was
  # imported with. The launcher compares it with the image's own and logs
  # generator_defaults_mismatch when they differ.
  # [--generator_defaults_digest]
  # ↑ A DAG from a newer commit than the image names a different digest, and
  # the launcher says so. · ↓ Unset: nothing is compared, as on a CLI launch.
  # generator_defaults_digest: null

# =========================================================================
# SAMPLING — the reference sample and the source-stats profiler
# =========================================================================
sampling:
  # Reference rows (n) — How many source rows the generator reads as its
  # reference sample (n). Every profile, pool seed and validation baseline is
  # estimated from these rows. [--reference_rows_limit · ADR 0005, 0022]
  # ↑ A smaller DKW band (four times the rows per halving), better tails and
  # rare categories. A new digest makes the run cold: every pool and chunk
  # rebuilds, and driver memory and profiling time grow linearly. · ↓ A
  # cheaper sample query and a smaller leak surface, but rare categories and
  # tails vanish first. Cardinality stays truncated at n either way.
  reference_rows_limit: 10000

  # Source-stats tier — Which source-stats tier the profiler writes: off,
  # sample (the reference sample, free) or exact (one aggregate scan of the
  # live table). [--source_stats · ADR 0022]
  # ↑ exact adds HLL++ distinct, deciles and top-k over the whole table, and
  # the exact distinct count sizes the free-text pool target. One BigQuery
  # scan of the source per run. · ↓ off writes no stats rows, no JSON and no
  # pool hints; engines still profile per worker. sample is free, but every
  # distinct count is capped at the rows the sample saw.
  source_stats: sample

  # Literal top values up to (distinct) — Literal source values land in the
  # stats only for enum-like columns with at most this many distinct values.
  # Above it a column gets shapes, entropy and lengths, never values.
  # ↑ More columns store literal values in the stats table: the exemplar-leak
  # surface grows. · ↓ Fewer literal values; more columns are described by
  # shape and entropy only.
  top_values_max_distinct: 50

  # Top values kept — How many literal top values an enum-like column keeps
  # in its stats entry.
  # ↑ More of the head of the distribution is visible in the stats row. · ↓ A
  # smaller stats row; the tail of an enum is summarised by entropy only.
  top_values_top_k: 8

  # Shape masks kept — How many character-shape masks (9 digit, A upper, a
  # lower) a column's source_table_stats entry keeps, with their shares. The
  # engines build their own shape mixes and never read it.
  # ↑ The stats entry records more of a long-tailed format's minority masks;
  # generation does not change. · ↓ The stats entry keeps only the dominant
  # masks; generation does not change.
  shape_mix_top_k: 8

  # Length percentiles — The three length quantiles a string column's
  # source_table_stats entry records, under the fixed names len_p05, len_p50
  # and len_p95. The pool prompt's length hint has its own fixed p05–p95 band
  # and never reads these.
  # ↑ A wider band records more of the length tails in the stats entry;
  # prompts and generation do not change. · ↓ A tighter band records only
  # typical lengths in the stats entry; prompts and generation do not change.
  length_percentiles: [0.05, 0.5, 0.95]

  # Null-pattern column cap — Tables wider than this skip the row
  # null-pattern pass, which costs O(rows × columns).
  # ↑ Wide tables get their joint null structure measured, at a pass whose
  # alphabet grows with width. · ↓ More tables fall back to per-column null
  # rates only.
  null_pattern_max_cols: 64

  # Null patterns kept — How many row null patterns (which columns are null
  # together) the __table__ entry keeps.
  # ↑ More of the joint null structure is recorded. · ↓ Only the most common
  # patterns survive.
  null_pattern_top_k: 8

# =========================================================================
# GENERATION — what is generated, and how close to the source
# =========================================================================
generation:
  # Engine — Which GenerationEngine runs, by its ENGINE_REGISTRY name: b1_rag
  # (retrieval plus bounded LLM pools) or b2_library (the sdgx wrapper).
  # [--engine · ADR 0006]
  # ↑ b2_library fits a library model once per worker and keeps more joint
  # structure; numerics interpolate through 11 deciles. · ↓ b1_rag samples
  # marginals from the whole sorted sample and seeds LLM pools by retrieval.
  engine: b1_rag

  # Rows to generate (M) — Rows to generate (M) for a root table. A driven
  # child derives its count from its parent's landed keys times the measured
  # fan-out (ADR 0036). [--num_rows]
  # ↑ More rows reuse each pool value more often and tighten identifier
  # keyspaces; time grows linearly. · ↓ Faster runs; the fidelity per row
  # does not change, because the sample, not M, sets the error.
  num_rows: 1000

  # Similarity — A 0–1 dial the engines interpret differently: b2 maps it to
  # sampling temperatures, b1 only blends its temporal draws. [--similarity]
  # ↑ b2: colder categorical sampling and a lower LLM temperature, output
  # closer to the reference. b1: temporal draws anchored nearer observed
  # instants. · ↓ b2: hotter sampling, more divergence. b1: temporal draws
  # closer to uniform over the range.
  similarity: 0.5

  # Seed — An explicit base RNG seed; empty derives one per (run_id,
  # batch_id), so runs never replay across triggers. [--seed]
  # ↑ A fixed seed replays the same draws for the same run inputs — useful
  # for A/B runs and goldens. · ↓ Empty (default) keeps every trigger's draws
  # independent.
  seed: ''

  # Rows per element — Rows per Beam element. At the default it scales with
  # --num_rows toward about 1,000 elements, never below 16. [--batch_size]
  # ↑ Fewer, larger elements amortise per-element Python overhead over
  # vectorized draws; a failed batch loses more rows. · ↓ More elements, more
  # per-element overhead: 16 rows per element made a 1M-row run pay it 62,500
  # times.
  batch_size: 16

  # Temporal floor, b1 (now minus years) — b1 clamps the jitter floor of
  # generated dates to now minus this many years; fully historical columns
  # keep their observed range.
  # ↑ Older dates are allowed again. · ↓ A tighter window pushes generated
  # instants toward the present.
  temporal_max_age_years_b1: 10

  # Temporal floor, b2 (now minus years) — b2's floor for generated dates and
  # timestamps: max(observed min, now minus this many years). A column whose
  # whole range is older keeps it.
  # ↑ Older dates are allowed again. · ↓ A tighter window; the decile
  # vector's sub-floor points collapse onto the floor.
  temporal_max_age_years_b2: 10

# =========================================================================
# FREE TEXT — pools, routing and expansion
# =========================================================================
free_text:
  # Free-text expansion — The shape-preserving expander after pool draws: off
  # (pool draws only), identifiers (code-like columns expand from their shape
  # mix) or all. [--freetext_expansion]
  # ↑ all also mutates digit runs inside texty draws: more distinct values,
  # never an LLM call. · ↓ off caps every free-text column's distinct count
  # at the pool size.
  freetext_expansion: identifiers

  # Pool seed strategy — How the 8 prompt seeds are chosen: centroid (densest
  # region), kcenter (spans the column's modes) or kcenter_rotate (re-seeded
  # per attempt). [--pool_seed_strategy]
  # ↑ kcenter and kcenter_rotate widen coverage of rare modes; rotate
  # forfeits vLLM prefix caching by design. · ↓ centroid (control) keeps a
  # byte-identical prefix and conditions on the densest region.
  pool_seed_strategy: centroid

  # Prompt constraints — Attach each column's llm_prompt_constraint and
  # measured length band to pool prompts, as a constant suffix.
  # [--prompt_constraints · ADR 0024]
  # ↑ on: prompts follow the declared format; the shared prefix stays
  # cacheable. · ↓ off: prompts rely on exemplars alone.
  prompt_constraints: 'on'

  # Prompt debug logging — Log each built pool prompt as a milestone: off,
  # redacted (seed exemplars elided) or full. [--prompt_debug · ADR 0024]
  # ↑ full logs verbatim prompts at WARNING: reference values reach Dataflow
  # logs. Debug runs only. · ↓ off logs nothing about prompts.
  prompt_debug: 'off'

  # Decode-time pattern guidance — Constrain identifier-ish pool completions
  # at decode time with a charset and length regex (vLLM structured output).
  # [--pool_pattern_guidance]
  # ↑ true: fewer off-format values reach the post-hoc gate, at an unmeasured
  # T4 throughput cost. · ↓ empty or false (default): the post-hoc format
  # gate alone protects pools.
  pool_pattern_guidance: ''

  # Build the pool layer — Build free-text pools in their own branch and
  # persist them (skipped when this reference digest and model are already
  # stored). [--build_pool_layer · ADR 0020]
  # ↑ true: pools are built once and every worker reads them (warm runs skip
  # the LLM); a no-op without freetext_pools_table. · ↓ empty: pools are
  # inferred inside every worker process's setup().
  build_pool_layer: 'true'

  # Pool cap — The most distinct values a free-text pool can hold, shared by
  # both engines' ladders and the launcher's PK-capacity preflight. A PK
  # routed to a pool caps at it. [ADR 0018, 0028]
  # ↑ More diversity per column, at LLM cost linear in the pool size. · ↓
  # Cheaper pools; M rows reuse each value M/cap times.
  free_text_pool_max: 512

  # Values per LLM call — Values requested per LLM call: one JSON-array
  # completion. [ADR 0013]
  # ↑ Fewer round trips per pool, longer completions per call. · ↓ More round
  # trips; each call is shorter and cheaper to retry.
  pool_values_per_call: 32

  # Parallel choices (n) — Independent completions (vLLM n=) per HTTP round
  # trip, de-duplicated across choices. It multiplies novel yield per call
  # about four times.
  # ↑ More yield per round trip; more sequences in flight on the GPU. · ↓
  # Less parallel sampling; more round trips.
  pool_parallel_choices: 4

  # Stagnation window — Once every escalation level has run, this many
  # consecutive low-yield attempts end a pool ladder.
  # ↑ Ladders keep trying longer against decaying yield. · ↓ Ladders stop
  # sooner; a slow-but-productive column may end undersized.
  pool_stagnation_window: 3

  # Stagnation: min novel per attempt — An attempt that adds fewer novel
  # values than this counts toward stagnation.
  # ↑ Stricter: more attempts count as stagnant, ladders end sooner. · ↓
  # Looser: a trickle of novel values keeps a ladder alive.
  # null = derived: max(1, pool_values_per_call // 8)
  pool_stagnation_min_novel: null

  # Format-collapse exit — Consecutive full-yield rounds with zero in-format
  # values that end a ladder (a structural mismatch temperature cannot fix).
  # [ADR 0033]
  # ↑ More wasted rounds before the shape fallback takes over. · ↓ Faster
  # exit to the shape fallback, less tolerance for a noisy first round.
  pool_format_collapse_rounds: 2

  # Pool ladders in parallel — How many column ladders run in parallel on a
  # thread pool; vLLM continuous-batches the concurrent requests.
  # ↑ More concurrency, until the GPU's KV cache queues the extra sequences.
  # · ↓ Closer to sequential ladders: setup time grows with the number of
  # free-text columns.
  pool_build_max_workers: 4

  # Source-domain rejection cap — The largest source-distinct set kept as a
  # worker-side rejection filter against copies. Above it the engine degrades
  # loudly to sample-only rejection. [ADR 0023]
  # ↑ High-cardinality columns keep full-domain copy rejection, at tens of MB
  # of worker memory per million strings. · ↓ More columns fall back to
  # rejecting only what the sample saw.
  source_domain_cap: 1000000

  # Unique ratio for free text — A string column whose unique share exceeds
  # this, with a long mean length, routes to free text instead of
  # categorical.
  # ↑ Fewer columns reach the LLM pool. · ↓ More columns reach the LLM pool,
  # including repetitive ones.
  free_text_unique_ratio: 0.9

  # Mean length for free text — The mean rendered length above which a
  # high-unique string column is free text.
  # ↑ Short unique strings stay categorical or shaped. · ↓ Short unique
  # strings route to the pool.
  free_text_min_mean_len: 20

  # Categorical up to (distinct) — Above this distinct count a string column
  # is high-cardinality and treated as free text even if short.
  # ↑ More columns stay categorical (sampled from their observed values). · ↓
  # More columns become free text or shaped identifiers.
  free_text_max_categories: 50

# =========================================================================
# RAG — the embedder, the chunk store and the exemplar pick
# =========================================================================
rag:
  # Embedder weights URI — gs:// path of the B.1 RAG embedder's weights;
  # empty uses the HashingEmbedder. [--embedder_uri]
  # ↑ Setting it loads bge-small from GCS (never the Hub) for semantic
  # retrieval. · ↓ Empty: hashing vectors, no model download, lexical
  # neighbours only.
  embedder_uri: ''

  # Build the RAG layer — Populate synthetic_rag.rag_chunks from this run's
  # reference sample (skipped when the digest is already present for this
  # embedder). [--build_rag_layer · ADR 0017, 0019]
  # ↑ true: chunks and vectors persist, and later runs read them instead of
  # re-embedding; a no-op without rag_chunks_table. · ↓ empty: the engine
  # embeds its 1,024 rows in setup on every fresh digest.
  build_rag_layer: 'true'

  # Row documents embedded — How many fingerprint-ordered reference rows are
  # embedded as row documents: exactly the rows the engine reads back.
  # [--rag_row_docs_limit · ADR 0019]
  # ↑ More rows in the in-worker index and more population cost; a value
  # above the reference sample is clamped to it. · ↓ A smaller index that
  # covers fewer of the sample's modes.
  rag_row_docs_limit: 1024

  # Value chunks per free-text column — Distinct (column, value) chunks
  # embedded per free-text column; a near-unique column stays bounded here.
  # [ADR 0019]
  # ↑ More candidates for the top-8 exemplar pick, more embedding work. · ↓
  # Fewer candidates; rare values are less likely to be seeds.
  max_free_text_values_per_column: 1024

  # Exemplars per prompt (top-k) — Exemplars retrieved to seed each free-text
  # pool prompt.
  # ↑ Longer prompts with more context; exemplar echoes become more likely. ·
  # ↓ Shorter prompts, less diversity to condition on.
  rag_top_k: 8

  # bge max tokens — Tokens bge-small reads per chunk; longer serialized rows
  # are truncated.
  # ↑ Fixed by the checkpoint's position embeddings. · ↓ Truncates more of
  # each serialized row.
  bge_max_length: 512

  # Free VRAM before the embedder takes CUDA — Free VRAM required before the
  # embedder's auto device picks CUDA over CPU. [ADR 0014, 0019]
  # ↑ The embedder yields the GPU more often (safer next to vLLM). · ↓ More
  # CUDA embeds, and a real OOM risk when the card is already spoken for.
  embedder_min_free_vram: 536870912

# =========================================================================
# GUARDRAILS — the gate and the landing write mode
# =========================================================================
guardrails:
  # Threshold tier — The threshold tier (dev, uat, prd) that selects the
  # BLOCKER ratio a run may reach before it fails. [--env]
  # ↑ Toward prd: a stricter gate (1 %). · ↓ Toward dev: a looser gate (20
  # %).
  env: dev

  # Uniqueness mode — How duplicates are handled before landing: exact (one
  # full-row shuffle barrier), exact_chained (the older three-barrier chain)
  # or streaming (measure, do not remove). [--uniqueness_mode · ADR 0034]
  # ↑ exact_chained: three shuffles per table, kept for A/B runs only. · ↓
  # streaming: no barrier between generation and BigQuery; duplicate rows
  # land and the run still fails the gate.
  uniqueness_mode: exact

  # Uniqueness mode, driven children — The uniqueness mode for a driven child
  # without identity columns: its PK is unique by construction, so streaming
  # measures without a barrier. [--driven_uniqueness_mode · ADR 0036]
  # ↑ exact adds a barrier the construction already made unnecessary. · ↓
  # streaming (default) lands rows without the landing-path shuffle.
  driven_uniqueness_mode: streaming

  # Write disposition — Landing-table write mode: append (WRITE_APPEND) or
  # overwrite (WRITE_TRUNCATE). [--write_disposition]
  # ↑ overwrite replaces the table: the re-run after a streaming-mode
  # failure. · ↓ append adds rows; the DLQ, validation_runs and rag_chunks
  # always append.
  write_disposition: append

  # Thresholds file — Where the per-environment severity gates are read from.
  # [--thresholds_uri]
  # ↑ Point it at a gs:// copy to change the gates without rebuilding the
  # image. · ↓ Unreadable: the launch falls back to a permissive gate and
  # says so.
  thresholds_uri: config/thresholds.yml

  # Key-repeat share tolerance — The absolute tolerance between the source's
  # key-repeat share and the landed one, when a launch adjusted the model
  # (ADR 0038). [ADR 0038]
  # ↑ Looser verdicts on an adjusted table's copy. · ↓ Tighter: per-key
  # sampling noise (O(1/√keys)) may flag a faithful copy.
  repeat_share_tolerance: 0.05

# =========================================================================
# RELATIONAL — keys, edges and FK key samples
# =========================================================================
relational:
  # Generate FK relationships — Honour declared relationships: a launch
  # expands to the table's whole FK component, parents first, and children
  # sample landed parent keys. [--generate_fk_relationships · ADR 0029]
  # ↑ true (default): referential integrity by construction. · ↓ false:
  # declared edges are ignored loudly and FK columns use marginals.
  generate_fk_relationships: 'true'

  # Relationship models — Where the relationship models live: a folder or
  # YAML file, local or gs://. The only source of relational truth.
  # [--relationships_uri · ADR 0032]
  # ↑ A gs:// path changes PK/FK without rebuilding the image. · ↓ The
  # default reads config/relationships packaged in the image.
  relationships_uri: config/relationships

  # Multi-table mode — How a multi-table plan runs: single_job (one fleet,
  # one vLLM ignition, in-DAG key handoff) or sequential_jobs.
  # [--multi_table_mode · ADR 0030]
  # ↑ sequential_jobs: one job per table, parents first — a fallback for
  # debugging. · ↓ single_job (default): one worker fleet for the whole
  # component.
  multi_table_mode: single_job

  # On a measured model conflict — What a measured contradiction between the
  # relationship model and the source does: adjust (drop the disproved PK and
  # announce it) or stop. [--on_model_conflict · ADR 0035, 0038]
  # ↑ stop refuses the launch, as before ADR 0038. · ↓ adjust (default)
  # carries on and reproduces the source's key-repeat share.
  on_model_conflict: adjust

  # Candidates per shared key (Top-M) — Top-M parent candidates kept per
  # shared value on a conditional (diamond) edge. [--fk_candidate_cap ·
  # ADR 0037]
  # ↑ A wider per-key choice, and fewer keys per batch to keep a request
  # under the value cap. · ↓ Hot shared keys wrap sooner over a shorter
  # candidate list.
  fk_candidate_cap: 64

  # Identity columns — Columns synthesized fresh for every row (PK, UUID),
  # never sampled from the reference. [--identity_cols]
  # ↑ More columns get per-row-unique values none of which is copied from the
  # source. · ↓ Empty: only the relationship model's identity columns apply.
  identity_cols: ''

  # Primary key columns — A primary key for a table the relationship model
  # does not cover; duplicates divert as pk.duplicate. [--pk_cols]
  # ↑ More columns make a wider key that fewer rows can collide on. · ↓
  # Empty: the relationship model decides the key.
  pk_cols: ''

  # Parent landing override — Expert override — the project.dataset parents
  # landed in, when it is not the landing table's own. [--fk_parent_landing ·
  # ADR 0029]
  # ↑ Set: parent keys are read from that dataset. · ↓ Empty: parents are
  # assumed to land next to the child.
  fk_parent_landing: ''

  # Parent keys sampled (floor) — The side-input cap: a child samples at most
  # this many parent key tuples unless its PK needs more. [ADR 0030, 0035]
  # ↑ Bigger side inputs per worker, fewer duplicate draws. · ↓ Smaller side
  # inputs; PKs built on the key draw collide sooner.
  fk_key_sample_floor: 100000

  # Parent keys sampled (ceiling) — The largest parent-key side input the
  # sizing will ask for (about 40 MB pickled per million single-column keys).
  # [ADR 0031, 0035]
  # ↑ More SDK memory per process; past it the answer is the co-partitioned
  # join (ADR 0036). · ↓ PK capacity runs out sooner on big children.
  fk_key_sample_ceiling: 1000000

  # Capacity margin over num_rows — The capacity target over num_rows when PK
  # members are drawn at random: at 10×, expected duplicates are about 4.8 %.
  # [ADR 0035]
  # ↑ Fewer duplicate draws, larger side inputs. · ↓ More pk.duplicate rows
  # diverted to the DLQ.
  fk_key_sample_margin: 10

  # Candidate values per request — The most candidate values one fan-out
  # request may carry per conditional edge; keys per batch shrink to stay
  # under it. [ADR 0037]
  # ↑ Bigger requests and fewer elements. · ↓ Smaller requests; more elements
  # for the same keys.
  max_conditional_values_per_request: 100000

# =========================================================================
# SERVING — the model, vLLM and the worker fleet
# =========================================================================
serving:
  # Model client — Which ModelClient generates: vllm (a server the worker
  # owns), mlx (local Apple smoke) or fake (no model). [--client_type ·
  # ADR 0014]
  # ↑ vllm: real free-text pools on a GPU worker. · ↓ fake: exercises the
  # whole Dataflow → BigQuery path without a GPU.
  client_type: vllm

  # Model URI — The gs:// location of the LLM weights, staged once from a
  # model hub; config/models.yml lists them. [--model_uri · required]
  # ↑ Point it at another staged model to change the generator's LLM. · ↓
  # Required — a launch without it is refused.
  model_uri: null

  # vLLM dtype — vLLM's --dtype: auto (the checkpoint's), float16 or
  # bfloat16. [--vllm_dtype · ADR 0014]
  # ↑ bfloat16 needs an L4-class GPU. · ↓ float16 is required on T4 for bf16
  # checkpoints like Qwen; refused for Gemma (empty output).
  # null = derived from gpu: t4 → float16, l4 → bfloat16
  vllm_dtype: null

  # vLLM max model len — vLLM's --max-model-len cap; without it the KV cache
  # is sized for the checkpoint's native context. [--vllm_max_model_len]
  # ↑ Longer prompts fit, and the KV cache takes more VRAM (262k native
  # context killed a T4 at startup). · ↓ Less VRAM for KV; 8,192 already
  # dwarfs the synthesis prompts.
  # null = no cap — the checkpoint's native context (the T4 needs a cap)
  vllm_max_model_len: '8192'

  # Autoscaling — Fleet sizing: auto (pinned when --initial_workers is set),
  # fixed (pinned, workers required) or throughput (Dataflow scales).
  # [--autoscaling · ADR 0034]
  # ↑ throughput: Dataflow scales freely; multi runs lost about 4 min per job
  # to mid-job scale-downs. · ↓ fixed: a fleet that starts and stays full.
  autoscaling: auto

  # Initial workers — The initial Dataflow worker count; empty keeps
  # Dataflow's own default. [--initial_workers · ADR 0034]
  # ↑ A scale run starts at its max_num_workers and skips the ramp. · ↓
  # Empty: the R6 pair started on 2 workers and ran 8 min at a quarter of its
  # steady rate.
  initial_workers: ''

  # GPU profile — The workers' GPU; a null vllm_dtype follows it. [--gpu]
  # ↑ l4: bfloat16, more VRAM. · ↓ t4: cheaper; float16 only, no Gemma.
  gpu: l4

  # SDK containers — SDK processes per worker. [--sdk_containers · ADR 0034]
  # ↑ multi: one per vCPU, past the GIL ceiling. · ↓ single: one per worker.
  sdk_containers: multi

  # Launcher VM — The Flex launcher's machine. [--launcher_machine_type]
  # ↑ Faster image pull and table prep. · ↓ Cheaper; risks the 12-min limit.
  launcher_machine_type: e2-standard-8
