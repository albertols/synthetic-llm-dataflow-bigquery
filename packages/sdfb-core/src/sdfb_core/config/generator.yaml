# Generator configuration: the DEFAULTS. Every value line is the default the
# generator loads. Precedence: this file < composer/sdfb_env.yaml < DAG
# trigger values < your --config_uri file (keys it omits fall back).
# Copy only the keys you want to pin; a file of your own starts with
# `config_version: 1`. Comments are abridged from sdfb_core/config/
# catalogue.yaml by scripts/doc/render_generator_config.py --fix (never
# touches a value); the catalogue holds the full text.
#
#   [--x · ADR n · required]  the CLI / Flex / Composer flag, its ADR, and
#                             whether a launch needs a value
#   ↑ / ↓                     what raising / lowering the value does
#   null = ...                what a null means (otherwise `required`)
#   'on', 'false', '8192'     quoted: string-encoded CLI values, keep them

config_version: 1

# =========================================================================
# IO — where a launch reads from and writes to
# =========================================================================
io:
  # DDL pin — A pinned _ddl.json read only when live schema extraction fails
  # (air-gap, BigQuery outage) [--ddl_uri · ADR 0027]
  # ↑ A path: the pin is the… · ↓ Empty: no fallback…
  ddl_uri: ''

  # Reference table — The source table the reference sample is SELECTed from
  # and the schema is extracted… [--reference_table · ADR 0005 · required]
  # ↑ Point it at another table to… · ↓ Required with launch.tables…
  reference_table: null

  # Landing table — Where valid synthetic rows land [--landing_table ·
  # ADR 0029, 0030 · required]
  # ↑ More tables in the list widen… · ↓ Required with launch.tables…
  landing_table: null

  # Dead-letter table — Where rejected records land with their rule id and
  # full error context [--dlq_table · required]
  # ↑ Point it at another dataset to… · ↓ Required — a launch without it…
  dlq_table: null

  # Create landing table — true creates the landing table on first write from
  # the derived schema [--create_if_not_exists]
  # ↑ true: a first launch creates… · ↓ false: a missing landing table…
  create_if_not_exists: 'false'

  # Run summary table — Where each launch writes one summary row per table —
  # the gate outcome and its provenance [--validation_runs_table]
  # ↑ Set: every launch is recorded… · ↓ Empty: no summary row is written
  validation_runs_table: ''

  # RAG chunk store — The persisted embedding store B.1 reads instead of
  # re-embedding its row documents [--rag_chunks_table · ADR 0019]
  # ↑ Set: stored vectors are read… · ↓ Empty: every worker embeds its…
  rag_chunks_table: ''

  # Free-text pool store — The persisted free-text pools workers read instead
  # of rebuilding them [--freetext_pools_table · ADR 0020]
  # ↑ Set: stored pools are served… · ↓ Empty: every worker process…
  freetext_pools_table: ''

  # Fan-out stats cache — Caches each driving edge's measured source fan-out
  # so a repeat launch skips the… [--fk_fanout_stats_table · ADR 0036]
  # ↑ Set: a repeat launch reads the… · ↓ Empty: fan-out is measured on…
  fk_fanout_stats_table: ''

  # Source stats table — Where per-column source stats rows are written, once
  # per table and reference digest [--source_stats_table · ADR 0022]
  # ↑ Set: the stats are queryable… · ↓ Empty: the stats land only in…
  source_stats_table: ''

  # Source stats JSON — A gs:// or local path the source stats are also
  # written to as one JSON file [--source_stats_json]
  # ↑ Set: the stats are kept next to the run's… · ↓ Empty: no JSON artifact
  source_stats_json: ''

  # Source dataset — With launch.tables all, the project.dataset every
  # table's source is read from under the… [--source_dataset · ADR 0045]
  # ↑ Set: a whole-model launch reads… · ↓ Empty: required with…
  source_dataset: ''

  # Landing dataset — With launch.tables all, the project.dataset every table
  # lands in, under its own name [--landing_dataset · ADR 0045]
  # ↑ Set: a whole-model launch… · ↓ Empty: required with…
  landing_dataset: ''

# =========================================================================
# LAUNCH — which tables, how many jobs, and the launch identity
# =========================================================================
launch:
  # Run id — The launch's identity — it seeds batch draws when seed is empty
  # and names every summary row [--run_id · required]
  # ↑ A fresh id per trigger keeps… · ↓ Required, and a flag only…
  # run_id: null

  # Tables — Which tables a launch generates [--tables · ADR 0045]
  # ↑ all: one launch generates the… · ↓ explicit (the default)…
  tables: explicit

  # Tables per job (K) — With launch.tables all, the most tables one Dataflow
  # job generates [--max_tables_per_job · ADR 0045]
  # ↑ Fewer, larger jobs… · ↓ More, smaller jobs…
  max_tables_per_job: 10

  # Parallel batch jobs — How many batch jobs scripts/launch/run_model.py
  # runs at once [--max_parallel_jobs · ADR 0045]
  # ↑ The batches finish sooner… · ↓ One at a time (the default)…
  max_parallel_jobs: 1

  # Prep threads — Threads a multi-table launcher reads schemas, reference
  # samples and source stats on… [--prep_workers · ADR 0045]
  # ↑ More tables read at once… · ↓ 1: each table is read in turn…
  prep_workers: 8

  # Batch index — The batch of a whole-model launch this job generates (b00
  # is 0) [--batch_index]
  # ↑ A later batch of the same plan · ↓ Unset: the launcher runs every…
  # batch_index: null

  # Batch count — How many batches the orchestrator planned [--batch_count]
  # ↑ Must equal the launcher's own… · ↓ Unset: only together with…
  # batch_count: null

# =========================================================================
# SAMPLING — the reference sample and the source-stats profiler
# =========================================================================
sampling:
  # Reference rows (n) — How many source rows the generator reads as its
  # reference sample (n) [--reference_rows_limit · ADR 0005, 0022]
  # ↑ A smaller DKW… · ↓ A cheaper sample query and a…
  reference_rows_limit: 10000

  # Source-stats tier — Which source-stats tier the profiler writes
  # [--source_stats · ADR 0022]
  # ↑ exact adds HLL++ distinct… · ↓ off writes no stats rows…
  source_stats: sample

  # Literal top values up to (distinct) — Literal source values land in the
  # stats only for enum-like columns with at most this many distinct values
  # ↑ More columns store literal… · ↓ Fewer literal values…
  top_values_max_distinct: 50

  # Top values kept — How many literal top values an enum-like column keeps
  # in its stats entry
  # ↑ More of the head of the… · ↓ A smaller stats row…
  top_values_top_k: 8

  # Shape masks kept — How many character-shape masks (9 digit, A upper, a
  # lower) a column's source_table_stats entry keeps, with their shares
  # ↑ The stats entry records more of… · ↓ The stats entry keeps only the…
  shape_mix_top_k: 8

  # Length percentiles — The three length quantiles a string column's
  # source_table_stats entry records, under the fixed names len_p05…
  # ↑ A wider band records more of… · ↓ A tighter band records only…
  length_percentiles: [0.05, 0.5, 0.95]

  # Null-pattern column cap — Tables wider than this skip the row
  # null-pattern pass, which costs O(rows × columns)
  # ↑ Wide tables get their joint… · ↓ More tables fall back to…
  null_pattern_max_cols: 64

  # Null patterns kept — How many row null patterns (which columns are null
  # together) the __table__ entry keeps
  # ↑ More of the joint null… · ↓ Only the most common patterns…
  null_pattern_top_k: 8

# =========================================================================
# GENERATION — what is generated, and how close to the source
# =========================================================================
generation:
  # Engine — Which GenerationEngine runs, by its ENGINE_REGISTRY name
  # [--engine · ADR 0006]
  # ↑ b2_library fits a library model… · ↓ b1_rag samples marginals from…
  engine: b1_rag

  # Rows to generate (M) — Rows to generate (M) for a root table [--num_rows
  # · required]
  # ↑ More rows reuse each pool value… · ↓ Faster runs; the fidelity per…
  num_rows: null

  # Similarity — A 0–1 dial the engines interpret differently [--similarity]
  # ↑ b2: colder categorical sampling… · ↓ b2: hotter sampling…
  similarity: 0.5

  # Seed — An explicit base RNG seed [--seed]
  # ↑ A fixed seed replays the same… · ↓ Empty (default) keeps every…
  seed: ''

  # Rows per element — Rows per Beam element [--batch_size]
  # ↑ Fewer, larger elements amortise… · ↓ More elements, more per-element…
  batch_size: 16

  # Temporal floor, b1 (now minus years) — b1 clamps the jitter floor of
  # generated dates to now minus this many years
  # ↑ Older dates are allowed again · ↓ A tighter window pushes generated…
  temporal_max_age_years_b1: 10

  # Temporal floor, b2 (now minus years) — b2's floor for generated dates and
  # timestamps
  # ↑ Older dates are allowed again · ↓ A tighter window; the decile…
  temporal_max_age_years_b2: 10

# =========================================================================
# FREE TEXT — pools, routing and expansion
# =========================================================================
free_text:
  # Free-text expansion — The shape-preserving expander after pool draws
  # [--freetext_expansion]
  # ↑ all also mutates digit runs… · ↓ off caps every free-text…
  freetext_expansion: identifiers

  # Pool seed strategy — How the 8 prompt seeds are chosen
  # [--pool_seed_strategy]
  # ↑ kcenter and kcenter_rotate… · ↓ centroid (control) keeps a…
  pool_seed_strategy: centroid

  # Prompt constraints — Attach each column's llm_prompt_constraint and
  # measured length band to pool prompts… [--prompt_constraints · ADR 0024]
  # ↑ on: prompts follow the declared… · ↓ off: prompts rely on exemplars…
  prompt_constraints: 'on'

  # Prompt debug logging — Log each built pool prompt as a milestone
  # [--prompt_debug · ADR 0024]
  # ↑ full logs verbatim prompts at… · ↓ off logs nothing about prompts
  prompt_debug: 'off'

  # Decode-time pattern guidance — Constrain identifier-ish pool completions
  # at decode time with a charset and length… [--pool_pattern_guidance]
  # ↑ true: fewer off-format values… · ↓ empty or false (default)…
  pool_pattern_guidance: ''

  # Build the pool layer — Build free-text pools in their own branch and
  # persist… [--build_pool_layer · ADR 0020]
  # ↑ true: pools are built once and… · ↓ empty: pools are inferred…
  build_pool_layer: ''

  # Pool cap — The most distinct values a free-text pool can hold, shared by
  # both engines' ladders and the launcher's PK-capacity… [ADR 0018, 0028]
  # ↑ More diversity per column… · ↓ Cheaper pools; M rows reuse…
  free_text_pool_max: 512

  # Values per LLM call — Values requested per LLM call [ADR 0013]
  # ↑ Fewer round trips per pool… · ↓ More round trips…
  pool_values_per_call: 32

  # Parallel choices (n) — Independent completions (vLLM n=) per HTTP round
  # trip, de-duplicated across choices
  # ↑ More yield per round trip… · ↓ Less parallel sampling…
  pool_parallel_choices: 4

  # Stagnation window — Once every escalation level has run, this many
  # consecutive low-yield attempts end a pool ladder
  # ↑ Ladders keep trying longer… · ↓ Ladders stop sooner…
  pool_stagnation_window: 3

  # Stagnation: min novel per attempt — An attempt that adds fewer novel
  # values than this counts toward stagnation
  # ↑ Stricter: more attempts count… · ↓ Looser: a trickle of novel…
  # null = derived: max(1, pool_values_per_call // 8)
  pool_stagnation_min_novel: null

  # Format-collapse exit — Consecutive full-yield rounds with zero in-format
  # values that end a… [ADR 0033]
  # ↑ More wasted rounds before the… · ↓ Faster exit to the shape…
  pool_format_collapse_rounds: 2

  # Pool ladders in parallel — How many column ladders run in parallel on a
  # thread pool
  # ↑ More concurrency… · ↓ Closer to sequential ladders…
  pool_build_max_workers: 4

  # Source-domain rejection cap — The largest source-distinct set kept as a
  # worker-side rejection filter against copies [ADR 0023]
  # ↑ High-cardinality columns keep… · ↓ More columns fall back to…
  source_domain_cap: 1000000

  # Unique ratio for free text — A string column whose unique share exceeds
  # this, with a long mean length, routes to free text instead of categorical
  # ↑ Fewer columns reach the LLM pool · ↓ More columns reach the LLM pool…
  free_text_unique_ratio: 0.9

  # Mean length for free text — The mean rendered length above which a
  # high-unique string column is free text
  # ↑ Short unique strings stay… · ↓ Short unique strings route to…
  free_text_min_mean_len: 20

  # Categorical up to (distinct) — Above this distinct count a string column
  # is high-cardinality and treated as free text even if short
  # ↑ More columns stay… · ↓ More columns become free text…
  free_text_max_categories: 50

# =========================================================================
# RAG — the embedder, the chunk store and the exemplar pick
# =========================================================================
rag:
  # Embedder weights URI — gs:// path of the B.1 RAG embedder's weights
  # [--embedder_uri]
  # ↑ Setting it loads bge-small from… · ↓ Empty: hashing vectors…
  embedder_uri: ''

  # Build the RAG layer — Populate synthetic_rag.rag_chunks from this run's
  # reference… [--build_rag_layer · ADR 0017, 0019]
  # ↑ true: chunks and vectors… · ↓ empty: the engine embeds its…
  build_rag_layer: ''

  # Row documents embedded — How many fingerprint-ordered reference rows are
  # embedded as row documents [--rag_row_docs_limit · ADR 0019]
  # ↑ More rows in the in-worker… · ↓ A smaller index that covers…
  rag_row_docs_limit: 1024

  # Value chunks per free-text column — Distinct (column, value) chunks
  # embedded per free-text column [ADR 0019]
  # ↑ More candidates for the top-8… · ↓ Fewer candidates…
  max_free_text_values_per_column: 1024

  # Exemplars per prompt (top-k) — Exemplars retrieved to seed each free-text
  # pool prompt
  # ↑ Longer prompts with more… · ↓ Shorter prompts, less diversity…
  rag_top_k: 8

  # bge max tokens — Tokens bge-small reads per chunk
  # ↑ Fixed by the checkpoint's… · ↓ Truncates more of each…
  bge_max_length: 512

  # Free VRAM before the embedder takes CUDA — Free VRAM required before the
  # embedder's auto device picks CUDA over CPU [ADR 0014, 0019]
  # ↑ The embedder yields the GPU… · ↓ More CUDA embeds…
  embedder_min_free_vram: 536870912

# =========================================================================
# GUARDRAILS — the gate and the landing write mode
# =========================================================================
guardrails:
  # Threshold tier — The threshold tier (dev, uat, prd) that selects the
  # BLOCKER ratio a run may reach before it fails [--env]
  # ↑ Toward prd: a stricter gate (1 %) · ↓ Toward dev: a looser gate (20 %)
  env: dev

  # Uniqueness mode — How duplicates are handled before landing
  # [--uniqueness_mode · ADR 0034]
  # ↑ exact_chained: three shuffles… · ↓ streaming: no barrier between…
  uniqueness_mode: exact

  # Uniqueness mode, driven children — The uniqueness mode for a driven child
  # without identity columns [--driven_uniqueness_mode · ADR 0036]
  # ↑ exact adds a barrier the… · ↓ streaming (default) lands rows…
  driven_uniqueness_mode: streaming

  # Write disposition — Landing-table write mode: append (WRITE_APPEND) or
  # overwrite (WRITE_TRUNCATE) [--write_disposition]
  # ↑ overwrite replaces the table… · ↓ append adds rows; the DLQ…
  write_disposition: append

  # Thresholds file — Where the per-environment severity gates are read from
  # [--thresholds_uri]
  # ↑ Point it at a gs:// copy to… · ↓ Unreadable: the launch falls…
  thresholds_uri: config/thresholds.yml

  # Key-repeat share tolerance — The absolute tolerance between the source's
  # key-repeat share and the landed one… [ADR 0038]
  # ↑ Looser verdicts on an adjusted… · ↓ Tighter: per-key sampling noise…
  repeat_share_tolerance: 0.05

# =========================================================================
# RELATIONAL — keys, edges and FK key samples
# =========================================================================
relational:
  # Generate FK relationships — Honour declared relationships
  # [--generate_fk_relationships · ADR 0029]
  # ↑ true (default): referential… · ↓ false: declared edges are…
  generate_fk_relationships: 'true'

  # Relationship models — Where the relationship models live
  # [--relationships_uri · ADR 0032]
  # ↑ A gs:// path changes PK/FK… · ↓ The default reads…
  relationships_uri: config/relationships

  # Multi-table mode — How a multi-table plan runs [--multi_table_mode ·
  # ADR 0030]
  # ↑ sequential_jobs: one job per… · ↓ single_job (default)…
  multi_table_mode: single_job

  # On a measured model conflict — What a measured contradiction between the
  # relationship model and the source… [--on_model_conflict · ADR 0035, 0038]
  # ↑ stop refuses the launch… · ↓ adjust (default) carries on and…
  on_model_conflict: adjust

  # Candidates per shared key (Top-M) — Top-M parent candidates kept per
  # shared value on a conditional (diamond)… [--fk_candidate_cap · ADR 0037]
  # ↑ A wider per-key choice… · ↓ Hot shared keys wrap sooner…
  fk_candidate_cap: 64

  # Identity columns — Columns synthesized fresh for every row (PK, UUID),
  # never sampled from the reference [--identity_cols]
  # ↑ More columns get per-row-unique… · ↓ Empty: only the relationship…
  identity_cols: ''

  # Primary key columns — A primary key for a table the relationship model
  # does not cover [--pk_cols]
  # ↑ More columns make a wider key… · ↓ Empty: the relationship model…
  pk_cols: ''

  # Parent landing override — Expert override — the project.dataset parents
  # landed in… [--fk_parent_landing · ADR 0029]
  # ↑ Set: parent keys are read from… · ↓ Empty: parents are assumed to…
  fk_parent_landing: ''

  # Parent keys sampled (floor) — The side-input cap: a child samples at most
  # this many parent key tuples unless its PK needs more [ADR 0030, 0035]
  # ↑ Bigger side inputs per worker… · ↓ Smaller side inputs…
  fk_key_sample_floor: 100000

  # Parent keys sampled (ceiling) — The largest parent-key side input the
  # sizing will ask… [ADR 0031, 0035]
  # ↑ More SDK memory per process… · ↓ PK capacity runs out sooner on…
  fk_key_sample_ceiling: 1000000

  # Capacity margin over num_rows — The capacity target over num_rows when PK
  # members are drawn at random [ADR 0035]
  # ↑ Fewer duplicate draws… · ↓ More pk.duplicate rows diverted…
  fk_key_sample_margin: 10

  # Candidate values per request — The most candidate values one fan-out
  # request may carry per conditional edge [ADR 0037]
  # ↑ Bigger requests and fewer… · ↓ Smaller requests…
  max_conditional_values_per_request: 100000

# =========================================================================
# SERVING — the model, vLLM and the worker fleet
# =========================================================================
serving:
  # Model client — Which ModelClient generates [--client_type · ADR 0014]
  # ↑ vllm: real free-text pools on a… · ↓ fake: exercises the whole…
  client_type: vllm

  # Model URI — The gs:// location of the LLM weights, staged once from a
  # model hub [--model_uri · required]
  # ↑ Point it at another staged… · ↓ Required — a launch without it…
  model_uri: null

  # vLLM dtype — vLLM's --dtype: auto (the checkpoint's), float16 or bfloat16
  # [--vllm_dtype]
  # ↑ bfloat16 needs an L4-class GPU · ↓ float16 is required on T4 for bf16…
  vllm_dtype: auto

  # vLLM max model len — vLLM's --max-model-len cap [--vllm_max_model_len]
  # ↑ Longer prompts fit… · ↓ Less VRAM for KV…
  # null = no cap — the checkpoint's native context (the T4 needs a cap)
  vllm_max_model_len: '8192'

  # Autoscaling — Fleet sizing: auto (pinned when --initial_workers is set),
  # fixed (pinned… [--autoscaling · ADR 0034]
  # ↑ throughput: Dataflow scales… · ↓ fixed: a fleet that starts and…
  autoscaling: auto

  # Initial workers — The initial Dataflow worker count [--initial_workers ·
  # ADR 0034]
  # ↑ A scale run starts at its… · ↓ Empty: the R6 pair started on 2…
  initial_workers: ''
