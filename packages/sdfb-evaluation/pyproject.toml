[project]
name = "sdfb-evaluation"
version = "0.1.0"
description = "Standalone statistical evaluation of synthetic BigQuery tables against their source (Apache Beam, BigQuery)."
requires-python = ">=3.11,<3.12"
license = { text = "Apache-2.0" }
readme = "README.md"
dependencies = [
    "apache-beam[gcp]==2.74.0",
    "numpy>=2.0",
    "scipy>=1.14",
    "scikit-learn>=1.6",
    "pyyaml>=6.0",
    "google-auth>=2.30",
    "google-cloud-bigquery>=3,<4",
    "requests>=2.32",
]

[project.scripts]
sdfb-eval = "sdfb_evaluation.cli.main:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-timeout>=2.3", "hypothesis>=6.100", "mypy>=1.11", "types-PyYAML", "types-requests", "jinja2>=3.1"]

[tool.uv]
# Beam 2.74 → envoy-data-plane → betterproto==2.0.0b6 (pre-release): same pin as the root workspace.
constraint-dependencies = ["betterproto==2.0.0b6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdfb_evaluation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["gcp: requires live GCP credentials", "slow: takes >5s"]
# A test that hangs fails instead of blocking the run (pytest-timeout). The
# slowest test, a module fixture included, takes about 60 s on a slow laptop;
# 300 s leaves room for a loaded machine. The method is "thread" because a hang
# inside native code (a classifier's fit) never returns to the interpreter, so
# a signal could not interrupt it: the watchdog prints every thread's stack and
# ends the session. faulthandler prints the stacks a little earlier even when
# the interpreter lock is held.
timeout = 300
timeout_method = "thread"
faulthandler_timeout = 240

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
ignore_missing_imports = true
