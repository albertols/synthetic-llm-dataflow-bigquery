# Personal-path image build (ADR 0016 carve-out from ADR 0008).
# Reuses mainline docker/Dockerfile UNMODIFIED: it builds from public base
# images and bootstraps uv from PyPI, and uv.lock is pinned to
# files.pythonhosted.org, so `uv sync --frozen` needs no changes here.
steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --platform=linux/amd64
      - -f=docker/Dockerfile
      - -t=${_IMAGE_URI}
      - --build-arg=SDFB_SDK_CONTAINER_IMAGE_ARG=${_IMAGE_URI}
      - --build-arg=GIT_COMMIT_ARG=${_GIT_COMMIT}
      - .

images: ["${_IMAGE_URI}"]
options:
  logging: CLOUD_LOGGING_ONLY
  diskSizeGb: 200
timeout: 7200s
substitutions:
  _IMAGE_URI: unset
  _GIT_COMMIT: unknown
